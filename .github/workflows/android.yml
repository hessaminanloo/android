name: Android CI

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # These versions must stay in sync with app/build.gradle.kts.
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.0
  ANDROID_NDK_VERSION: 25.2.9519653
  CMAKE_VERSION: 3.22.1
  WHISPER_CPP_REF: v1.8.7

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platform-tools
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/ndk
            ${{ env.ANDROID_HOME }}/cmake
          key: ${{ runner.os }}-android-${{ env.ANDROID_PLATFORM }}-${{ env.ANDROID_BUILD_TOOLS }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.CMAKE_VERSION }}

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Configure Android SDK location
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Check out whisper.cpp for the JNI build
        run: git clone --depth 1 --branch "${WHISPER_CPP_REF}" https://github.com/ggml-org/whisper.cpp third_party/whisper.cpp

      - name: Set up Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          # The checked-in launcher is bootstrapped locally when this project
          # is first initialized; the pinned distribution remains authoritative.
          validate-wrappers: false

      - name: Build whisper.cpp JNI and debug APK
        run: ./gradlew --no-daemon :app:externalNativeBuildDebug :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meetmate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
